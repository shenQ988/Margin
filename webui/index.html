<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Margin web UI — chat with your Margin workspace."
      data-i18n-meta="description"
    />
    <meta name="theme-color" content="#f5efe4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#f5efe4" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Margin" />
    <link rel="icon" type="image/png" sizes="512x512" href="/brand/bookshelf_icon_512.png?v=2" />
    <link rel="apple-touch-icon" sizes="512x512" href="/brand/bookshelf_icon_512.png?v=2" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Quicksand:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #root {
        height: 100%;
      }

      /* App-like feel on touch devices: no double-tap zoom on interactive
         elements (system-level accessibility zoom still works), and no text
         size inflation on orientation change. */
      html {
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
      }

      body {
        margin: 0;
        background: #f5efe4;
        color: #0a0a0a;
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", "Noto Sans SC",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
      }

      html.dark body {
        background: #f5efe4;
        color: #0a0a0a;
      }

      .boot-splash {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
      }

      .boot-splash-inner {
        display: flex;
        align-items: center;
        gap: 10px;
        color: rgba(255, 255, 255, 0.74);
        font-size: 14px;
      }

      html:not(.dark) .boot-splash-inner {
        color: rgba(10, 10, 10, 0.64);
      }

      .boot-dot {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: currentColor;
        opacity: 0.75;
        animation: boot-pulse 1s ease-in-out infinite;
      }

      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(0.9);
          opacity: 0.45;
        }
        50% {
          transform: scale(1);
          opacity: 0.85;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("nanobot-webui.theme");
          var dark =
            stored === "dark" ||
            (!stored &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch {}
      })();
    </script>
    <title>Margin</title>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root">
      <div class="boot-splash">
        <div class="boot-splash-inner">
          <span class="boot-dot" aria-hidden="true"></span>
          <span data-boot-copy>Loading Margin…</span>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var localeKey = "nanobot.locale";
        var copy = {
          en: {
            boot: "Loading Margin…",
            description: "Margin web UI — chat with your Margin workspace."
          },
          "zh-CN": {
            boot: "正在加载 Margin…",
            description: "Margin Web UI —— 与你的 Margin 工作区对话。"
          },
          "zh-TW": {
            boot: "正在載入 Margin…",
            description: "Margin Web UI —— 與你的 Margin 工作區對話。"
          },
          fr: {
            boot: "Chargement de Margin…",
            description: "Interface web Margin — discutez avec votre espace de travail Margin."
          },
          ja: {
            boot: "Margin を読み込み中…",
            description: "Margin Web UI — Margin ワークスペースと会話します。"
          },
          ko: {
            boot: "Margin 불러오는 중…",
            description: "Margin 웹 UI — Margin 작업공간과 대화하세요."
          },
          es: {
            boot: "Cargando Margin…",
            description: "Interfaz web de Margin: conversa con tu espacio de trabajo de Margin."
          },
          "pt-BR": {
            boot: "Carregando Margin…",
            description: "Interface web do Margin — converse com o seu espaço de trabalho do Margin."
          },
          vi: {
            boot: "Đang tải Margin…",
            description: "Giao diện web Margin — trò chuyện với không gian làm việc Margin của bạn."
          },
          id: {
            boot: "Memuat Margin…",
            description: "UI web Margin — ngobrol dengan ruang kerja Margin Anda."
          }
        };

        function normalizeLocale(input) {
          if (!input) return "en";
          var raw = String(input).trim();
          if (!raw) return "en";
          if (copy[raw]) return raw;
          var lower = raw.toLowerCase();
          if (lower === "zh" || lower.indexOf("zh-cn") === 0 || lower.indexOf("zh-sg") === 0) {
            return "zh-CN";
          }
          if (
            lower.indexOf("zh-tw") === 0 ||
            lower.indexOf("zh-hk") === 0 ||
            lower.indexOf("zh-mo") === 0 ||
            lower.indexOf("zh-hant") === 0
          ) {
            return "zh-TW";
          }
          if (lower === "pt" || lower.indexOf("pt-") === 0) {
            return "pt-BR";
          }
          var base = lower.split("-")[0];
          return copy[base] ? base : "en";
        }

        try {
          var stored = localStorage.getItem(localeKey);
          var detected =
            stored ||
            (navigator.languages && navigator.languages[0]) ||
            navigator.language ||
            "en";
          var locale = normalizeLocale(detected);
          var localized = copy[locale] || copy.en;
          document.documentElement.lang = locale;
          var description = document.querySelector('[data-i18n-meta=\"description\"]');
          if (description) description.setAttribute("content", localized.description);
          var boot = document.querySelector("[data-boot-copy]");
          if (boot) boot.textContent = localized.boot;
        } catch {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
